[package]
name = "gatewayd"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The standalone data plane: config-driven Pingora proxy with attribution enforcement"

[[bin]]
name = "gatewayd"
path = "src/main.rs"

[[bin]]
name = "mock_upstream"
path = "src/bin/mock_upstream.rs"

[dependencies]
gateway-core = { path = "../gateway-core" }
serde_json = "1"
# Same foundation stack as spikes/proxy-pingora (Phase 0 decision: Pingora).
pingora = { version = "0.8", features = ["proxy"] }
# Same `http` the pingora stack uses; needed to rebuild the request Uri
# after dot-segment normalization.
http = "1"
async-trait = "0.1"
bytes = "1"
log = "0.4"
env_logger = "0.11"
