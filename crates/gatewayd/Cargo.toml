[package]
name = "gatewayd"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The standalone data plane: config-driven Pingora proxy with attribution enforcement"

[[bin]]
name = "gatewayd"
path = "src/main.rs"

[[bin]]
name = "mock_upstream"
path = "src/bin/mock_upstream.rs"

[[bin]]
name = "mock_sts"
path = "src/bin/mock_sts.rs"

[dependencies]
gateway-core = { path = "../gateway-core" }
# Phase 4: the signed-WASM policy host (wasmtime-embedded, fuel/epoch-bounded).
# A library — gatewayd stays one of the two binaries; the wasm runtime links in.
gateway-wasm = { path = "../gateway-wasm" }
# Phase 2 M1: the fleet wire contract, for control-plane client mode.
gateway-proto = { path = "../gateway-proto" }
serde_json = "1"
# RFC3339 expireTime parsing for the GCP SA-token cache (GB-8 auth).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Same foundation stack as spikes/proxy-pingora (Phase 0 decision: Pingora).
pingora = { version = "0.8", features = ["proxy"] }
# Same `http` the pingora stack uses; needed to rebuild the request Uri
# after dot-segment normalization.
http = "1"
async-trait = "0.1"
bytes = "1"
log = "0.4"
env_logger = "0.11"
# gRPC client stack for control-plane mode (dial gatewayctl, hold the stream).
tonic = "0.14"
tonic-prost = "0.14"
tokio-stream = "0.1"
# Already in the tree via pingora; used directly for the SIGHUP reload
# trigger (a dedicated current-thread runtime — pingora itself listens for
# SIGINT/SIGTERM/SIGQUIT, never SIGHUP), and — milestone 3 — for the GB-7
# STS credential exchange (net/io-util/time: a minimal HTTP/1.1 client).
# rt-multi-thread + macros drive the control-plane client's stream runtime.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "signal", "net", "io-util", "time", "sync"] }
