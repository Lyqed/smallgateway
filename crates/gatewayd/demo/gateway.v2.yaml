# The hot-swap target for scripts/demo.sh scenario (7): identical to
# gateway.yaml except the FLEET-scope pin flips env=prod -> env=canary, so
# the drain overlap is visible in one grep: the in-flight stream meters
# under cfg=v1 with env=prod while a concurrent request runs cfg=v2 with
# env=canary (echoed back by the mock upstream). Scenarios (10)/(11) then
# run GB-8/GB-7 under cfg=v2 — the canary pin shows up in the Vertex env
# label and the STS env session tag, versioned governance end to end.

providers:
  openai-demo:
    kind: openai
    upstream: { host: 127.0.0.1, port: 6190 }
  anthropic-demo:
    kind: anthropic
    upstream: { host: 127.0.0.1, port: 6190 }
  bedrock-demo:
    kind: bedrock
    upstream: { host: 127.0.0.1, port: 6190 }
  # GB-7: session-tag credentials. Tags come from ATTRIBUTION values that
  # the gateway itself establishes (env is pinned at fleet scope) — a tag
  # from a plain caller-asserted key is a config ERROR, never caller-raw.
  bedrock-sts-demo:
    kind: bedrock
    upstream: { host: 127.0.0.1, port: 6191 }
    sts:
      endpoint: { host: 127.0.0.1, port: 6199 }
      role_arn: arn:aws:iam::000000000000:role/gateway-demo
      region: us-east-1
      tags:
        - { key: team, from_attribution: billing_team }
        - { key: env, from_attribution: env }
  vertex-demo:
    kind: vertex
    upstream: { host: 127.0.0.1, port: 6190 }

# Scope 1 — fleet: every route inherits the team requirement and the
# env pin unless a lower scope explicitly replaces it.
fleet:
  attribution:
    required_keys: [team]
    headers: { team: x-attr-team, purpose: x-attr-purpose }
    pinned: { env: canary }

# Scope 2 — projects. /vertex opts into ml-platform, which extends the
# fleet's required keys around the explicit <base> marker and adds a
# CEL-derived channel tag (tier-1 extensibility: a real derivation, not a
# copied header — total, so it resolves with or without the header).
projects:
  ml-platform:
    attribution:
      required_keys: ['<base>', purpose]
      derived:
        channel: '"x-channel" in request.headers ? request.headers["x-channel"] : "api"'
    labels:
      - key: env
        from_attribution: env
      - key: channel
        from_attribution: channel

routes:
  # GB-1 (required tag) + GB-3 (operator pin, inherited from fleet).
  - prefix: /openai
    provider: openai-demo

  - prefix: /anthropic
    provider: anthropic-demo

  - prefix: /bedrock
    provider: bedrock-demo

  # GB-7: invoice-grade attribution on AWS — session-tagged credentials.
  - prefix: /bedrock-sts
    provider: bedrock-sts-demo
    attribution:
      pinned: { billing_team: ml-platform }

  # GB-8: invoice-grade attribution on Vertex — operator billing labels
  # merged into the generateContent body; operator wins over client labels.
  - prefix: /vertex
    provider: vertex-demo
    project: ml-platform
    labels:
      - key: cost_center
        value: platform-eng
      - key: team
        from_attribution: team
      - '<base>'

  # GB-2: `user` is proven from the verified JWT's `sub` claim. No caller
  # header exists for it — the key has no caller channel at all; only the
  # verified claim supplies it.
  - prefix: /claims
    provider: openai-demo
    attribution:
      required_keys: ['<base>', user]
      from_claims: { user: sub }

# Scope 4 — apps, keyed by the RESOLVED team value: the ml-research app
# tightens its own contract (adds a purpose pin so its requests are
# self-describing on the invoice).
apps:
  key: team
  overrides:
    ml-research:
      attribution:
        pinned: { purpose: research }

# GB-2 verification. Demo-only shared secret — a real deployment injects
# this from a secret manager, never from a committed file.
auth:
  jwt:
    hs256_secret: demo-secret-do-not-deploy

# GB-4: the operator owns every rejection body. `streaming` is the terminal
# event emitted when an in-flight stream is cut (type validated now; the
# mid-stream cut wires in a later phase).
rejections:
  missing_attribution:
    status: 428
    content_type: application/json
    body: '{"error":"attribution_required","missing":"{{key}}","route":"{{route}}","hint":"send the operator-named attribution headers (this demo: x-attr-team)"}'
    streaming:
      event: error
      data: '{"error":"attribution_required","missing":"{{key}}"}'
  unknown_route:
    status: 404
    content_type: application/json
    body: '{"error":"unknown_route","path":"{{route}}","hint":"no configured route prefix matches this path"}'
